name: Privacy policy site

# Publishes site/ (the privacy policy linked from the Play Store listing) to GitHub Pages:
# https://sinadehesh.github.io/Flora/privacy/
on:
  workflow_dispatch:
  push:
    branches: [main, claude/floralock-app-concept-i4dcyn]
    paths: ['site/**', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
