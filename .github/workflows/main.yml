name: Android builds

on:
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main, 'claude/**']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci
      - run: npm run typecheck && npm test

      # The Play Store needs a higher versionCode on every upload.
      - name: Set version code from run number
        run: node -e "const a=require('./app.json');a.expo.android.versionCode=${{ github.run_number }};require('fs').writeFileSync('app.json',JSON.stringify(a,null,2))"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # Without these secrets, builds are signed with Android's debug key: the APK installs fine, but the Play Store rejects the AAB.
      - name: Sign release builds with the upload key
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          cat >> android/app/build.gradle <<'EOF'
          android {
              signingConfigs {
                  upload {
                      storeFile file('upload.jks')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }
              }
              buildTypes { release { signingConfig signingConfigs.upload } }
          }
          EOF

      - name: Build APK and AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: "1. APK (install on phones)"
        uses: actions/upload-artifact@v4
        with:
          name: floralock-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: "2. AAB (Play Store)"
        uses: actions/upload-artifact@v4
        with:
          name: floralock-aab
          path: android/app/build/outputs/bundle/release/*.aab

  # Installs the APK on emulators across Android versions and checks that opening a locked
  # app really brings up the flower challenge (e2e/lock.yaml).
  lock-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 29, 33, 35] # Android 8, 10, 13, 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: floralock-apk
          path: apk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Lock test on Android API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/lock-e2e.sh

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lock-test-api-${{ matrix.api-level }}
          path: e2e-output
