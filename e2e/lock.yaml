# End-to-end check of the Android app lock (run by .github/scripts/lock-e2e.sh on emulators).
# Locks the system Settings app through FloraLock's own UI, opens Settings, and expects the
# flower challenge; then uses an emergency unlock and expects Settings to stay open.
appId: com.floralock.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Botany IQ|.*isn.t responding"
    timeout: 90000
# A just-booted emulator can show "System UI isn't responding" over the app; let it carry on.
- runFlow:
    when:
      visible: ".*isn.t responding"
    commands:
      - tapOn: "Wait"
- extendedWaitUntil:
    visible: "Botany IQ"
    timeout: 60000

# Settings tab > App lock > choose the app to lock
- tapOn: "Settings"
- tapOn: "Choose"
- tapOn: "Search apps"
- inputText: "settings"
- hideKeyboard
# By testID: tapping the text would hit the search box, which also shows the typed text.
- tapOn:
    id: "app-com.android.settings"
- back
- extendedWaitUntil:
    visible: "1 app locked"
    timeout: 10000
- tapOn: "Turn lock on"
- extendedWaitUntil:
    visible: ".*Lock is on"
    timeout: 10000

# Opening the locked app must bring up the challenge (directly, or via the fallback overlay).
- launchApp:
    appId: com.android.settings
- extendedWaitUntil:
    visible: "What is this plant\\?|Identify the plant"
    timeout: 20000
- runFlow:
    when:
      visible: "Identify the plant"
    commands:
      - tapOn: "Identify the plant"
- extendedWaitUntil:
    visible: "What is this plant\\?"
    timeout: 15000
- takeScreenshot: challenge-over-locked-app

# Emergency unlock opens Settings and it stays open during the unlock window.
# (Scroll first: on small screens these links sit below the photo and the answers.)
- scrollUntilVisible:
    element:
      text: "Emergency unlock.*"
    direction: DOWN
- tapOn: "Emergency unlock.*"
- scrollUntilVisible:
    element:
      text: "Continue to Settings"
    direction: DOWN
- tapOn: "Continue to Settings"
- extendedWaitUntil:
    notVisible: "What is this plant\\?"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- assertNotVisible: "What is this plant\\?"
- assertNotVisible: "Identify the plant"
- takeScreenshot: unlocked-app
