# End-to-end check of the Android app (run by .github/scripts/lock-e2e.sh on emulators).
# Goes through first-launch setup (plants per day, lock the system Settings app, turn the lock on),
# opens Settings and expects the flower challenge, uses an emergency unlock and expects Settings
# to stay open, then does today's lesson and exam.
appId: com.floralock.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Get started|.*isn.t responding"
    timeout: 90000
# A just-booted emulator can show "System UI isn't responding" over the app; let it carry on.
- runFlow:
    when:
      visible: ".*isn.t responding"
    commands:
      - tapOn: "Wait"
- extendedWaitUntil:
    visible: "Get started"
    timeout: 60000

# Setup: welcome > plants a day (keep 5) > apps to lock > turn the lock on
- tapOn: "Get started"
- extendedWaitUntil:
    visible: "How many plants a day\\?"
    timeout: 10000
- tapOn: "Next"
- tapOn: "Search apps"
- inputText: "settings"
- hideKeyboard
# By testID: tapping the text would hit the search box, which also shows the typed text.
- tapOn:
    id: "app-com.android.settings"
- tapOn: "Next"
- extendedWaitUntil:
    visible: "1 app locked"
    timeout: 10000
- tapOn: "Turn lock on"
- extendedWaitUntil:
    visible: ".*Lock is on"
    timeout: 10000
- tapOn: "Finish setup"
- extendedWaitUntil:
    visible: "Start today.s lesson"
    timeout: 10000

# Opening the locked app must bring up the challenge (directly, or via the fallback overlay).
- launchApp:
    appId: com.android.settings
- extendedWaitUntil:
    visible: "What is this plant\\?|Identify the plant"
    timeout: 20000
- runFlow:
    when:
      visible: "Identify the plant"
    commands:
      - tapOn: "Identify the plant"
- extendedWaitUntil:
    visible: "What is this plant\\?"
    timeout: 15000
- takeScreenshot: challenge-over-locked-app

# Emergency unlock opens Settings and it stays open during the unlock window.
# (Scroll first: on small screens these links sit below the photo and the answers.)
- scrollUntilVisible:
    element:
      text: "Emergency unlock.*"
    direction: DOWN
- tapOn: "Emergency unlock.*"
- scrollUntilVisible:
    element:
      text: "Continue to Settings"
    direction: DOWN
- tapOn: "Continue to Settings"
- extendedWaitUntil:
    notVisible: "What is this plant\\?"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- assertNotVisible: "What is this plant\\?"
- assertNotVisible: "Identify the plant"
- takeScreenshot: unlocked-app

# Today's lesson: each new plant once, then a multiple-choice exam on them.
- launchApp:
    appId: com.floralock.app
- tapOn: "Start today.s lesson"
- repeat:
    while:
      visible: "Next plant"
    commands:
      - tapOn: "Next plant"
- tapOn: "Start the exam"
- repeat:
    while:
      notVisible: "\\d+ of \\d+ right"
    commands:
      - tapOn:
          id: "choice-0"
      - scrollUntilVisible:
          element:
            text: "Next question|See my score"
          direction: DOWN
      - tapOn: "Next question|See my score"
- takeScreenshot: exam-score
- tapOn: "Done for today"
- extendedWaitUntil:
    visible: "Tomorrow: .*"
    timeout: 10000
