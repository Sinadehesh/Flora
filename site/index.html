<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FloraLock</title>
<meta name="description" content="Lock distracting apps. To open one, name a plant from its photo.">
<link rel="icon" href="favicon.png">
<style>
:root { --bg: #F6F4EE; --text: #1C2A21; --muted: #5E6B61; --accent: #2F5D43; }
@media (prefers-color-scheme: dark) { :root { --bg: #101612; --text: #E8EDE6; --muted: #9AA79D; --accent: #8CC9A0; } }
body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 56px 20px; text-align: center; }
h1 { font-family: Georgia, "Times New Roman", serif; font-size: 2.4rem; margin: 8px 0; }
p { color: var(--muted); }
a { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<main>
<img src="favicon.png" alt="" width="72" height="72">
<h1>FloraLock</h1>
<p>Lock the apps that eat your time. To open one, name a plant from its photo, and learn a few new plants every day.</p>
<p><a href="privacy/">Privacy policy</a></p>
</main>
</body>
</html>
